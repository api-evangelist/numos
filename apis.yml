name: Numos
description: >-
  Numos is an AI agent platform that automates accounting and financial planning
  & analysis (FP&A) workflows for finance teams. It layers above existing ERPs
  with "zero disruption to your current architecture" and learns a company's
  accounting policies and entity structures to run strategic FP&A and variance
  analysis, continuous month-end close, accounts payable orchestration, and
  accounts receivable / revenue recognition. Numos is headquartered in San Mateo,
  California and is backed by General Catalyst. Its product is delivered as a
  hosted web application (app.numosai.com); the company exposes no public
  developer API, documentation, or developer portal at this time. This profile
  was surfaced from the General Catalyst portfolio and enriched from Numos's
  public web surface.
